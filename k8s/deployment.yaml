apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-inference-deployment
  labels:
    app: llm-inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-inference
  template:
    metadata:
      labels:
        app: llm-inference
    spec:
      containers:
      - name: llm-inference-container
        image: llm-inference:latest # Replace with your docker hub image if pushing
        imagePullPolicy: IfNotPresent # Useful for local minikube images
        ports:
        - containerPort: 8000
        resources:
          limits:
            nvidia.com/gpu: 1 # Requesting 1 GPU
            memory: "8Gi"
            cpu: "2"
          requests:
            memory: "4Gi"
            cpu: "1"
        volumeMounts:
        - name: model-cache
          mountPath: /root/.cache/huggingface
      volumes:
      - name: model-cache
        emptyDir: {}
